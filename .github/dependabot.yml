# Dependency updates, as pull requests into dev (the branch every change starts from).
# Minor and patch updates come grouped, one pull request a week per ecosystem, so CI checks them together.
# Majors come one at a time: each is a migration, and for packages the registry items import it changes what
# products install, so it needs a changelog entry and a version bump (CONTRIBUTING, "Versions").
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Held major: it forces products to rewrite code for no visible gain (Panels 4 halves the keyboard step and resets
    # saved layouts). Its migration is ready on the branch deps/table9-panels4; lift this when a product needs it or
    # Panels 3 stops getting fixes. TanStack Table is no longer held: data-grid moved to Table 9 in 0.26.0.
    ignore:
      - dependency-name: react-resizable-panels
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: deps
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
