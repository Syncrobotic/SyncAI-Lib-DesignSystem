# Dependency updates, as pull requests into dev (the branch every change starts from).
# Minor and patch updates come grouped, one pull request a week per ecosystem, so CI checks them together.
# Majors come one at a time: each is a migration, and for packages the registry items import it changes what
# products install, so it needs a changelog entry and a version bump (CONTRIBUTING, "Versions").
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Held major: it forces products to rewrite code for no visible gain (Panels 4 halves the keyboard step and resets
    # saved layouts). Its migration is ready on the branch deps/table9-panels4; lift this when a product needs it or
    # Panels 3 stops getting fixes. TanStack Table is no longer held: data-grid moved to Table 9 in 0.26.0.
    # Held majors that are migrations, not bumps: @types/node follows the Node runtime (.nvmrc, 22); TypeScript 7
    # and zod 4 failed CI (#264, #266). Each moves in its own pull request when we choose to.
    ignore:
      - dependency-name: react-resizable-panels
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: zod
        update-types: ["version-update:semver-major"]
    # Titles read build(deps): … and build(deps-dev): …, Conventional Commits like every other PR.
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
