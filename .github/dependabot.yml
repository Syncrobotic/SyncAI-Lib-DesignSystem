# Dependency updates, as pull requests into dev (the branch every change starts from).
# Minor and patch updates come grouped, one pull request a week per ecosystem, so CI checks them together.
# Majors come one at a time: each is a migration, and for packages the registry items import it changes what
# products install, so it needs a changelog entry and a version bump (CONTRIBUTING, "Versions").
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Held majors that are migrations, not bumps: @types/node follows the Node runtime (.nvmrc, 22), so its types never
    # offer an API Node 22 lacks; TypeScript 7 waits for typescript-eslint and a JS API (see 0.42.0). Each moves in its
    # own pull request when we choose to.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    # Titles read build(deps): … and build(deps-dev): …, Conventional Commits like every other PR.
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
  # Actions are pinned by commit SHA (a tag can be moved); this keeps the SHAs and their "# v7" comments current. The
  # Playwright container image is pinned by digest and is not updated here: move it with @playwright/test (the same
  # version in package.json and every `container: image:`), or the baselines are shot in another browser.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
