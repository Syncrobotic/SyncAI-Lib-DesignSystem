# Dependency updates, as pull requests into dev (the branch every change starts from).
# Minor and patch updates come grouped, one pull request a week per ecosystem, so CI checks them together.
# Majors come one at a time: each is a migration, and for packages the registry items import it changes what
# products install, so it needs a changelog entry and a version bump (CONTRIBUTING, "Versions").
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Held majors: each forces products to rewrite code for no visible gain (Table 9 changes how every table is set
    # up; Panels 4 halves the keyboard step and resets saved layouts). Migrations are ready on the branches
    # deps/table9-panels4; lift these when a product needs them or the old major stops getting fixes.
    ignore:
      - dependency-name: "@tanstack/react-table"
        update-types: ["version-update:semver-major"]
      - dependency-name: react-resizable-panels
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: deps
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
