name: release
# When main carries a package.json version that has no tag yet, tag it vX.Y.Z and publish a GitHub Release
# whose notes are that version's CHANGELOG section. Bumping the version (and writing its CHANGELOG section) is the release.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - id: tagged
        run: |
          if git rev-parse -q --verify "refs/tags/v${{ steps.v.outputs.version }}" >/dev/null; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.tagged.outputs.exists == 'false'
        run: node scripts/release-notes.mjs "${{ steps.v.outputs.version }}" > notes.md
      - if: steps.tagged.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.v.outputs.version }}" --target "$GITHUB_SHA" --title "v${{ steps.v.outputs.version }}" --notes-file notes.md
