name: ci
# Runs on pull requests only: a merge into dev, stage or main lands a tree these checks already passed, so pushes are not
# re-checked. Run everything by hand on any branch: Actions → ci → Run workflow.
on:
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels the run it makes stale.
# Read only: no job here writes to the repository, and every job runs `npm ci`, so a dependency's install script gets
# no token worth stealing. Checkouts drop the token too (persist-credentials), as nothing fetches after them.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Into main, stage's tree arrives unchanged and stage already passed every check below on it: only what a release
  # needs is checked again. Its name is "check" too, so a required check called check is met either way.
  release:
    name: check
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      # The package version has its dated CHANGELOG section and no item is ahead of it (release.yml tags it)
      - run: node scripts/release-notes.mjs "$(node -p "require('./package.json').version")" > /dev/null
      - run: node scripts/release-guard.mjs

  check:
    if: github.event_name != 'pull_request' || github.base_ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint:tokens
      # Every registry item declares exactly what its files import, and hook users are client components
      - run: npm run lint:registry
      # Focus is never removed, a battery warns below 15 %, every chart block has a table view; comments are short, no history
      - run: npm run lint:rules
      # Every number goes through format-number: no toLocaleString (it follows the runtime locale), no second Intl cache
      - run: npm run lint:numbers
      # Overlays animate in and out, buttons press, timing comes from the motion tokens
      - run: npm run lint:motion
      # Every item file changed only with a version bump; the DTCG token files match the CSS theme
      - run: npm run lint:versions
      - run: npm run lint:dtcg
      # The API reference on each component page matches the types (npm run props)
      - run: npm run lint:props
      # Every component page's Accessibility tab has measured roles and Tab stops (scripts/a11y.cjs)
      - run: npm run lint:a11y
      # Every component with examples has its picture on /docs/components, light and dark (scripts/thumbs.mjs)
      - run: npm run lint:thumbs
      # The package version has its CHANGELOG section, so the release on main has notes
      - run: node scripts/release-notes.mjs "$(node -p "require('./package.json').version")" > /dev/null
      # Code correctness: the React rules of hooks (the React Compiler relies on them) and TypeScript's recommended rules
      - run: npm run lint
      # Also the registry items alone under noUncheckedIndexedAccess, as a strict product compiles them
      - run: npm run typecheck
      # Behaviour of safety-critical interactions: stop, stop all, slide to release, keyboard and AT paths
      - run: npm test
      # Registry JSON + docs site (Next.js)
      # Next.js keeps what it compiled in .next/cache: a later build of mostly the same tree reuses it. Keyed on the lockfile
      # and the sources, falling back to the newest cache for the same lockfile.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'site/**', 'registry/**', 'next.config.ts') }}
          restore-keys: next-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
      # No prerendered page over 400 KB of HTML, a few named ones held to their own ceilings (scripts/check-html-size.mjs)
      - run: npm run lint:html-size
      - run: npm run build-storybook
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: { name: registry, path: public/r }

  # Story checks: every story, dark and light, opened once for its screenshot (against the committed baselines in
  # tests/__screenshots__/) and for axe (WCAG 2.2 A/AA), split over four runners.
  # They gate promotion into stage, where a release is assembled, and manual runs. Main receives stage's tree unchanged,
  # so it is not checked again; PRs into dev and main get the fast checks (and, into dev, stories-changed).
  # They run in Playwright's own image (same Ubuntu, browser and fonts preinstalled): installing them took 20 s to 4.5 min.
  stories:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'stage')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: { image: "mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579" }
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env: { HOME: /root }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build-storybook
      - run: npx playwright test --update-snapshots=none --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: visual-baseline-${{ matrix.shard }}
          path: tests/__screenshots__
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: story-test-results-${{ matrix.shard }}
          path: test-results

  # On a pull request into dev, the stories it can change (scripts/changed-stories.mjs) run twice: once with axe, writing
  # their pictures, then again against those pictures. Their baselines move with the change, so a comparison with them
  # says nothing yet; drawing the same picture twice is what a story must do before the baseline is written on dev.
  stories-changed:
    if: github.event_name == 'pull_request' && github.base_ref == 'dev'
    runs-on: ubuntu-latest
    # A change to every item picks every story, two passes of about 13 minutes each.
    timeout-minutes: 35
    container: { image: "mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579" }
    env: { HOME: /root }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }
      - id: changed
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if echo "$files" | grep -qE '^(registry/syncrobotic/|stories/)'; then echo "run=true" >> "$GITHUB_OUTPUT"
          else echo "run=false" >> "$GITHUB_OUTPUT"; echo "No component or story changed: skipped."; fi
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22, cache: npm }
      - if: steps.changed.outputs.run == 'true'
        run: npm ci && npm run build-storybook
      - if: steps.changed.outputs.run == 'true'
        id: pick
        run: echo "grep=$(node scripts/changed-stories.mjs origin/${{ github.base_ref }})" >> "$GITHUB_OUTPUT"
      - if: steps.pick.outputs.grep != ''
        run: npx playwright test --update-snapshots=all --grep "${{ steps.pick.outputs.grep }}"
      - if: steps.pick.outputs.grep != ''
        run: STORY_CHECKS=visual npx playwright test --update-snapshots=none --grep "${{ steps.pick.outputs.grep }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: changed-story-results
          path: test-results

  # The built site, looked at the way the design-language checklist asks: corners that are not concentric (outer radius =
  # inner + padding, scripts/check-radius.cjs), rows of actions that wrap badly on a 375 px phone (scripts/check-wrap.cjs),
  # and axe on every docs page and block preview, dark and light (scripts/check-site-a11y.cjs; the examples' stories run
  # axe themselves).
  site-checks:
    if: github.event_name == 'pull_request' && github.base_ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container: { image: "mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579" }
    env: { HOME: /root, SITE: "http://127.0.0.1:3000" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # .next/cache, as in check
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'site/**', 'registry/**', 'next.config.ts') }}
          restore-keys: next-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
      # One step: the server started in the background lives as long as the step that started it.
      - run: |
          npx next start -p 3000 &
          timeout 60 bash -c 'until node -e "fetch(process.env.SITE).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"; do sleep 1; done'
          npm run check:radius
          npm run check:wrap
          npm run check:a11y

  # The Accessibility tab's measured roles and Tab stops (site/a11y.json) match the components as they render now.
  # Only when something that can change them changed: components, stories, the data or its scripts.
  a11y-data:
    if: github.event_name != 'pull_request' || github.base_ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: { image: "mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579" }
    env: { HOME: /root }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }
      - id: changed
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if echo "$files" | grep -qE '^(registry/syncrobotic/(ui|shell|examples)/|stories/|site/a11y|scripts/a11y)'; then
            # Into dev, only the components this change can move (scripts/a11y-affected.mjs); stage measures them all.
            if [ "${{ github.base_ref }}" = "dev" ]; then
              only=$(node scripts/a11y-affected.mjs "origin/${{ github.base_ref }}")
              # Empty: the change moves no measured component (a block's stories, say), so there is nothing to measure.
              if [ -z "$only" ]; then
                echo "run=false" >> "$GITHUB_OUTPUT"; echo "No measured component changed: skipped."; exit 0
              fi
              if [ "$only" != "all" ]; then echo "only=$only" >> "$GITHUB_OUTPUT"; fi
            fi
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "No component or story changed: skipped."
          fi
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22, cache: npm }
      - if: steps.changed.outputs.run == 'true'
        run: npm ci
      # .next/cache, as in check
      - if: steps.changed.outputs.run == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'site/**', 'registry/**', 'next.config.ts') }}
          restore-keys: next-${{ hashFiles('package-lock.json') }}-
      - if: steps.changed.outputs.run == 'true'
        run: npx next build
      - if: steps.changed.outputs.run == 'true'
        run: |
          npx next start -p 3100 &
          for _ in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3100 && break; sleep 1; done
          SITE=http://localhost:3100 OUT=a11y-measured.json ONLY="${{ steps.changed.outputs.only }}" node scripts/a11y.cjs
          node scripts/a11y-check.mjs --measured a11y-measured.json ${{ steps.changed.outputs.only && '--only' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure() && steps.changed.outputs.run == 'true'
        with: { name: a11y-measured, path: a11y-measured.json }

  # Installs every item into a fresh Next.js app with the shadcn CLI, then typechecks and builds it. Skipped when a pull
  # request touches nothing an installed item is made of (docs pages, the site, stories, CI).
  registry-e2e:
    if: github.event_name != 'pull_request' || github.base_ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }
      - id: changed
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "registry=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if echo "$files" | grep -qE '^(registry/|registry\.json|package(-lock)?\.json|scripts/registry|components\.json|tsconfig)'; then
            echo "registry=true" >> "$GITHUB_OUTPUT"
          else
            echo "registry=false" >> "$GITHUB_OUTPUT"; echo "No registry files changed: skipped."
          fi
      - if: steps.changed.outputs.registry == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22, cache: npm }
      - if: steps.changed.outputs.registry == 'true'
        run: npm ci
      - if: steps.changed.outputs.registry == 'true'
        run: npm run registry:build
      - if: steps.changed.outputs.registry == 'true'
        run: npm run test:registry
