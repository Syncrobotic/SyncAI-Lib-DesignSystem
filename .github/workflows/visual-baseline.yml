name: visual-baseline
# Writes the visual regression baselines on CI's own Linux browser (screenshots from a laptop never match its fonts)
# and commits them to the chosen branch. Run it once to start, and again after an intended visual change:
# Actions → visual-baseline → Run workflow → branch.
on:
  workflow_dispatch:

permissions:
  contents: write
  # A push made with this workflow's token starts no workflows, so the pull request would wait on a check that never runs.
  # Dispatching ci is the one start that token is allowed: its checks land on the new commit.
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    # The same image the story checks run in, so baselines and checks render with the same fonts.
    container: { image: "mcr.microsoft.com/playwright:v1.65.1-noble" }
    env: { HOME: /root }
    steps:
      # The commit below needs git in the image; checkout without it would download a tarball with no history.
      - run: command -v git || (apt-get update && apt-get install -y --no-install-recommends git)
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build-storybook
      - run: npx playwright test tests/stories.spec.ts --update-snapshots=all
        env: { STORY_CHECKS: visual }
      # The pictures on /docs/components are the same stories, so they are taken here too, in the same browser:
      # a story change that needs new baselines gets new pictures in the same commit.
      - run: npm run thumbs
      # The pictures on /blocks come from the blocks' previews on the built site (scripts/thumbs.mjs --blocks starts it).
      - run: npx next build && npm run thumbs -- --blocks
      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/__screenshots__ public/thumbs
          git diff --cached --quiet && echo "Baselines unchanged" && exit 0
          git commit -m "test(visual): update baselines from ci"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
        id: commit
      - if: steps.commit.outputs.pushed == 'true'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: >-
          node -e 'fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches`,
          { method: "POST", headers: { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: "application/vnd.github+json" },
          body: JSON.stringify({ ref: process.env.GITHUB_REF_NAME }) }).then((r) => { console.log("dispatch ci:", r.status); if (r.status !== 204) process.exit(1) })'
