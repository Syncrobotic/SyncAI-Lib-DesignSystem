name: visual-baseline
# Writes the visual regression baselines on CI's own Linux browser (screenshots from a laptop never match its fonts)
# and commits them to the chosen branch. Run it once to start, and again after an intended visual change:
# Actions → visual-baseline → Run workflow → branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build-storybook
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/visual.spec.ts --update-snapshots=all
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/__screenshots__
          git diff --cached --quiet && echo "Baselines unchanged" && exit 0
          git commit -m "Visual baselines from CI"
          git push
